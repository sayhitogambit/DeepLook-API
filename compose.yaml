services:
  api:
    build: .
    ports:
      - "127.0.0.1:${DEEPLOOK_PORT:-47231}:47231"
    environment:
      DEEPLOOK_ADMIN_TOKEN: ${DEEPLOOK_ADMIN_TOKEN:?Set a private administrator token}
      DEEPLOOK_MAX_CONCURRENT: ${DEEPLOOK_MAX_CONCURRENT:-2}
    volumes:
      - data:/app/data
    cap_drop:
      - ALL
    # The upstream seccomp profile gates Chromium's sandbox chroot syscall on
    # this bounding capability. The service itself still runs as UID 10001.
    cap_add:
      - SYS_CHROOT
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/playwright-seccomp.json
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    shm_size: 256m
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  data:
